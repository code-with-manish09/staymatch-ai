<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NestMate Register</title>

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>

<style>
:root{
  --navy:#0F1F3D;
  --teal:#0EA5C9;
  --teal2:#6EE7F7;
  --white:#fff;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:'Instrument Sans',sans-serif;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#0F1F3D,#0EA5C9);
  overflow:hidden;
  padding:20px;
}

/* blobs */
.blob{
  position:absolute;
  width:400px;
  height:400px;
  background:radial-gradient(circle,var(--teal2),transparent);
  filter:blur(80px);
  opacity:.5;
  animation:float 10s infinite ease-in-out;
  z-index:1;
}
.blob:nth-child(1){top:-120px;left:-120px;}
.blob:nth-child(2){bottom:-120px;right:-80px;animation-delay:2s;}

@keyframes float{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-40px);}
}

/* card */
.card{
  width:100%;
  max-width:420px;
  max-height:90vh;
  overflow-y:auto;
  padding:30px;
  border-radius:20px;
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.15);
  box-shadow:0 20px 60px rgba(0,0,0,0.25);
  color:#fff;
  z-index:2;
}

/* scrollbar card */
.card::-webkit-scrollbar{ width:6px; }
.card::-webkit-scrollbar-thumb{
  background:linear-gradient(var(--teal), var(--teal2));
  border-radius:10px;
}

/* inputs */
.input-box{
  position:relative;
  margin-bottom:16px;
}

.input-box input,
.input-box select{
  width:100%;
  padding:13px 12px;
  border:none;
  outline:none;
  border-radius:10px;
  background:rgba(255,255,255,0.12);
  color:#fff;
  font-size:14px;
  appearance:none;
  transition:background 0.2s ease;
}

/* 🔥 FIX WHITE FLASH */
.input-box input:focus,
.input-box select:focus{
  background:rgba(255,255,255,0.12) !important;
  color:#fff;
}

/* 🔥 FIX AUTOFILL */
input:-webkit-autofill,
input:-webkit-autofill:hover,
input:-webkit-autofill:focus{
  -webkit-box-shadow: 0 0 0 1000px rgba(255,255,255,0.12) inset !important;
  -webkit-text-fill-color:#fff !important;
  transition: background-color 9999s ease-in-out 0s;
}

/* label */
.input-box label{
  position:absolute;
  left:12px;
  top:14px;
  font-size:13px;
  color:rgba(255,255,255,.6);
  pointer-events:none;
  transition:.25s;
}

/* floating */
.input-box input:not(:placeholder-shown) + label,
.input-box input:focus + label,
.input-box input:valid + label{
  top:-8px;
  left:10px;
  font-size:11px;
  background:rgba(15,31,61,.8);
  padding:2px 6px;
  border-radius:6px;
}

.input-box select:focus + label,
.input-box select:valid + label{
  top:-8px;
  left:10px;
  font-size:11px;
  background:rgba(15,31,61,.8);
  padding:2px 6px;
  border-radius:6px;
}

/* dropdown arrow */
.input-box.select-box::after{
  content:"⌄";
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  font-size:18px;
  color:rgba(255,255,255,0.7);
  pointer-events:none;
}

/* select same look */
.input-box select{
  background:rgba(255,255,255,0.12);
  color:#fff;
}

/* options */
.input-box select option{
  background:#ffffff;
  color:#0F1F3D;
}

/* remove number arrows */
input::-webkit-outer-spin-button,
input::-webkit-inner-spin-button{
  -webkit-appearance:none;
  margin:0;
}

/* file upload */
.file-upload-wrapper{margin-bottom:20px;}
.custom-file-upload{
  display:block;
  width:100%;
  padding:12px;
  background:rgba(255,255,255,0.1);
  border:1px dashed rgba(255,255,255,0.3);
  border-radius:10px;
  text-align:center;
  cursor:pointer;
}
#file-input{display:none;}

/* button */
.btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:linear-gradient(135deg,var(--teal),var(--teal2));
  color:#0F1F3D;
  font-weight:700;
  cursor:pointer;
}

.logo{font-family:'Bricolage Grotesque';font-weight:800;font-size:24px;}
.logo span{color:var(--teal2);}
h2{font-family:'Bricolage Grotesque';font-size:26px;}
.sub{font-size:13px;color:rgba(255,255,255,.7);margin-bottom:20px;}
.footer{text-align:center;margin-top:15px;}
.footer a{color:var(--teal2);}

.input-box select.selected + label{
  top:-8px;
  left:10px;
  font-size:11px;
  background:rgba(15,31,61,.8);
  padding:2px 6px;
  border-radius:6px;
}
</style>
</head>

<body>

<div class="blob"></div>
<div class="blob"></div>

<div class="card">
  <div class="logo">Stay<span>Match</span></div>
  <h2>Create account 🚀</h2>
  <div class="sub">Find your perfect flatmate faster.</div>

  <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    <div class="input-box">
      <input type="text" name="username" placeholder=" " required>
      <label>Username</label>
    </div>

    <div class="input-box">
      <input type="text" name="full_name" placeholder=" " required>
      <label>Full Name</label>
    </div>

    <div class="input-box">
      <input type="number" name="age" placeholder=" " required>
      <label>Age</label>
    </div>

    <div class="input-box select-box">
      <select name="gender" required>
        <option value="" disabled selected hidden></option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
      </select>
      <label>Gender</label>
    </div>

    <div class="input-box">
      <input type="text" name="location" placeholder=" " required>
      <label>Location</label>
    </div>

    <div class="input-box">
      <input type="tel" name="contact" placeholder=" " required>
      <label>Contact Number</label>
    </div>

    <div class="file-upload-wrapper">
      <label for="file-input" class="custom-file-upload">📁 Choose Image/Video</label>
      <input id="file-input" type="file" name="profile_media" onchange="updateFileName(this)">
      <p id="file-name"></p>
    </div>

    <div class="input-box">
      <input type="email" name="email" placeholder=" " required>
      <label>Email</label>
    </div>

    <div class="input-box">
      <input type="password" name="password" placeholder=" " required>
      <label>Password</label>
    </div>

    <button type="submit">Register →</button>
  </form>

  <div class="footer">
    Already have an account? <a href="{% url 'login' %}">Log in</a>
  </div>
</div>

<script>
function updateFileName(input){
  document.getElementById('file-name').innerText = input.files[0]?.name || "";
}

/* 🔥 FIXED JS (outside function) */
document.querySelector("select[name='gender']").addEventListener("change", function(){
  if(this.value !== ""){
    this.classList.add("selected");
  }
});
</script>

</body>
</html>
